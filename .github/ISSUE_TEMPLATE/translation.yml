name: Translation
description: Report a wrong translation or ask for a new language
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. Deutsch, or a new one such as Nederlands
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should change?
      description: Quote the current text and suggest a better one. To add a whole language, see CONTRIBUTING.md.
    validations:
      required: true
