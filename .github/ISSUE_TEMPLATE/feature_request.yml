name: Feature request
description: Suggest an idea for DualPad
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like DualPad to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: The game or situation where you'd use it.
